# Checks Stuxedo's servers and websites with GitHup, then builds status.stuxedo.net
# (the GitHup status page with its legal pages, sitemap and 404 page) and
# deploys it to GitHub Pages.
name: Status

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHup check (GitHub may run it a little late)
    - cron: "7 * * * *"     # hourly rebuild, so "updated" times stay fresh
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .githup.yml
      - .github/workflows/status.yml

permissions:
  contents: write   # commit monitoring data
  issues: write     # open and close incident Issues
  pages: write      # deploy to GitHub Pages
  id-token: write

# One run at a time so data commits and deployments never race.
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    # Pushes only change the page, so they skip straight to the build.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.check.outputs.status-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: check
        uses: StuxGroup/GitHup@v1
        with:
          mode: check
          # Opt in: if GitHub runs the schedule late, catch up (up to 4 checks, 5 minutes apart).
          fill-gaps: "true"
          repeat: 4
          repeat-interval: 300

  deploy:
    needs: check
    # Rebuild on pushes and manual runs, when a status changed, and hourly.
    if: >-
      always() && (
        github.event_name != 'schedule' ||
        needs.check.outputs.changed == 'true' ||
        github.event.schedule == '7 * * * *'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}  # includes the data just committed
      - uses: actions/configure-pages@v6
      - name: Update the status table in the README
        uses: StuxGroup/GitHup@v1
        with:
          mode: readme
          site-url: https://status.stuxedo.net/
      # GitHup empties site-dir before building, so the status page goes in first.
      - name: Build the status page
        uses: StuxGroup/GitHup@v1
        with:
          mode: site
          deploy: "false"
          site-dir: _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
