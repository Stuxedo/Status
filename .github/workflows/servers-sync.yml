# Adds new Stuxedo servers to the status page on its own, daily: reads the *.servers.<cc>.stuxedo.net records
# from Cloudflare (scripts/sync-servers.py), and when there's a new one, releases it on test and opens a test -> main
# PR. It never pushes to main: Status rebuilds the page when Leo merges that PR (a push to main that changes
# .githup.yml starts it). Opening the PR needs "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions); without it the run leaves a warning with the compare link instead.
# Runs before the region pages' own sync (05:17). The new monitors go live only once its PR is merged, so merge
# this repo's PR before the region page's.
# Needs the CLOUDFLARE_DNS_TOKEN secret: a Cloudflare API token with Zone > DNS > Read on stuxedo.net only.
name: Servers sync

on:
  schedule:
    - cron: "12 5 * * *"
  workflow_dispatch:

permissions:
  contents: write        # commit and tag the release on test
  pull-requests: write   # open the test -> main PR

# Shares Status's group, so its data commits and this release never race.
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0

      - id: sync
        name: Add new servers from DNS
        env:
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_DNS_TOKEN" ]; then
            echo "::notice::The CLOUDFLARE_DNS_TOKEN secret isn't set, so there's nothing to check."
            exit 0
          fi
          python3 scripts/sync-servers.py

      - name: Release on test and open the PR
        if: always() && steps.sync.outputs.version != ''
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tests/version.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD:test "v$VERSION"
          if [ -n "$(gh pr list --base main --head test --state open --json number -q '.[0].number')" ]; then
            echo "::notice::A test -> main PR is already open, so v$VERSION joins it, ready to merge."
          elif ! gh pr create --base main --head test --title "Release v$VERSION" --body "New servers from DNS, released as v$VERSION by Servers sync. Merging deploys it."; then
            echo "::warning::Couldn't open the test -> main PR. Open it here: https://github.com/${GITHUB_REPOSITORY}/compare/main...test"
          fi
