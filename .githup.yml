# Stuxedo Server Status: https://status.stuxedo.net
# Checked every 5 minutes by .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
# Web hosting has its own status page, Stuxedo Web Status (status.stuxedo.dev); status.stuxedo.com is the
# landing page for both.
site:
  name: Stuxedo Server Status
  description: Live status of Stuxedo's servers and websites, checked every 5 minutes.
  # Its own badge icon: Stuxedo's tuxedo cat with a heartbeat badge, on a dark round avatar so it reads
  # on both themes. Built by scripts/badge-icons.py into assets/img/, which the Status workflow copies
  # into the site.
  logo: https://status.stuxedo.net/assets/img/stuxedo-status-icon.png
  favicon: https://status.stuxedo.net/assets/img/stuxedo-status-icon.png
  # Stuxedo's neon green; GitHup darkens it on the light theme until it reads.
  accent: "#4BF708"
  url: https://status.stuxedo.net/
  footer_links:
    - label: Stuxedo Web Status
      url: https://status.stuxedo.dev/
    - label: Server regions
      url: https://regionpage.stuxedo.net/
    - label: Report a problem
      url: https://github.com/Stuxedo/Status/issues/new

legal:
  operator: Stuxedo
  company: "Stuxedo is operated by Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 82a James Carter Road, Mildenhall, England, IP28 7DE."
  contact: legal@stuxedo.com
  host: GitHub Pages
  effective: 9 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history. The servers,
# their certificate checks and the Stuxedo site moved here from Stux.Group Status on
# 9 October 2026 with their history (data/<slug>/).
groups:
  - name: Stuxedo
    description: The Stuxedo website and the media it relies on.
    monitors:
      - name: Stuxedo
        url: https://stuxedo.com/
        description: Hosting and cloud services
      - name: Stuxedo Media CDN
        url: https://global.media.stuxedo.com/icon.png
        description: Shared logos and images used across every Stuxedo site
      - name: Stuxedo Status
        url: https://status.stuxedo.com/
        description: The status landing page (Web Status or Server Status)
      - name: Stuxedo Web Status
        url: https://status.stuxedo.dev/
        description: The web hosting status page
      - name: Stuxedo Control Panel
        url: https://dash.stuxedo.com/
        description: The hosting control panel customers sign in to
      - name: Stuxedo Webmail
        url: https://mash.stuxedo.com/
        description: Webmail for hosted email
      - name: Stuxedo Website Builder
        url: https://builder.stuxedo.com/
        description: The website builder
      - name: Stuxedo Support
        url: https://support.stuxedo.com/
        description: Help articles and support

  # Each server's instance page. The Stuxedo and Stux.Cloud region pages read these monitors
  # (slugs robo1, tiny1, kitt1, mixr1, mixr2, down1, soci1) for their live status.
  - name: Servers
    description: Each server's instance page, by region.
    monitors:
      - name: robo1
        url: https://robo1.servers.uk.stuxedo.net/
        description: UK
      - name: tiny1
        url: https://tiny1.servers.uk.stuxedo.net/
        description: UK
      - name: kitt1
        url: https://kitt1.servers.ca.stuxedo.net/
        description: Canada
      - name: mixr1
        url: https://mixr1.servers.es.stuxedo.net/
        description: Spain
      - name: mixr2
        url: https://mixr2.servers.fi.stuxedo.net/
        description: Finland
      - name: down1
        url: https://down1.servers.us.stuxedo.net/
        description: United States
      - name: soci1
        url: https://soci1.servers.fr.stuxedo.net/
        description: France

  # Every server checks daily that each certificate it uses has more than 21 days left
  # (/usr/local/sbin/cert-expiry-check) and publishes certificates-ok.txt while it does.
  - name: Certificates
    description: Whether every certificate on each server has more than 21 days left.
    monitors:
      - name: robo1 certificates
        url: https://robo1.servers.uk.stuxedo.net/certificates-ok.txt
        description: robo1 (UK)
      - name: tiny1 certificates
        url: https://tiny1.servers.uk.stuxedo.net/certificates-ok.txt
        description: tiny1 (UK), including Sm.lol's Cloudflare Origin Certificate
      - name: kitt1 certificates
        url: https://kitt1.servers.ca.stuxedo.net/certificates-ok.txt
        description: kitt1 (CA), including Kittens
      - name: mixr1 certificates
        url: https://mixr1.servers.es.stuxedo.net/certificates-ok.txt
        description: mixr1 (ES)
      - name: mixr2 certificates
        url: https://mixr2.servers.fi.stuxedo.net/certificates-ok.txt
        description: mixr2 (Finland), including Termix
      - name: down1 certificates
        url: https://down1.servers.us.stuxedo.net/certificates-ok.txt
        description: down1 (US)
      - name: soci1 certificates
        url: https://soci1.servers.fr.stuxedo.net/certificates-ok.txt
        description: soci1 (France)

  # Each region's website, served by that region's own server. It frames regionpage.stuxedo.net.
  - name: Region websites
    description: Each Stuxedo region's website, served by the region's own server.
    monitors:
      - name: Stuxedo UK
        url: https://uk.stuxedo.net/
        description: United Kingdom
      - name: Stuxedo Canada
        url: https://ca.stuxedo.net/
        description: Canada
      - name: Stuxedo Spain
        url: https://es.stuxedo.net/
        description: Spain
      - name: Stuxedo Finland
        url: https://fi.stuxedo.net/
        description: Finland
      - name: Stuxedo United States
        url: https://us.stuxedo.net/
        description: United States
      - name: Stuxedo France
        url: https://fr.stuxedo.net/
        description: France

  # Stuxedo's page templates on GitHub Pages, the original v1 designs kept as snapshots, and the
  # github.io redirect.
  - name: Templates
    description: Stuxedo's page templates and their v1 snapshots.
    monitors:
      - name: Stuxedo Region Page
        url: https://regionpage.stuxedo.net/
        description: The server regions, with live status for each server
      - name: Stuxedo Instance Page
        url: https://instancepage.stuxedo.net/
        description: The page each server's own address shows
      - name: Stuxedo Soonpage
        url: https://soonpage.stuxedo.net/
        description: The "coming soon" page
      - name: Stuxedo Maintenancepage
        url: https://maintenancepage.stuxedo.net/
        description: The maintenance page
      - name: Stuxedo Region Page v1
        url: https://regionpage-v1.stuxedo.net/
        description: The original green design, kept as a snapshot
      - name: Stuxedo Instance Page v1
        url: https://instancepage-v1.stuxedo.net/
        description: The original green design, kept as a snapshot
      - name: Stuxedo Soonpage v1
        url: https://soonpage-v1.stuxedo.net/
        description: The original green design, kept as a snapshot
      - name: Stuxedo Maintenancepage v1
        url: https://maintenancepage-v1.stuxedo.net/
        description: The original green design, kept as a snapshot
      - name: Stuxedo GitHub Pages Redirect
        url: https://stuxedo.github.io/
        description: Sends stuxedo.github.io to github.com/Stuxedo

  - name: Elsewhere
    description: Checked on their own status pages.
    links:
      - name: Stuxedo Web Status
        url: https://status.stuxedo.dev/
        description: The web hosting platform
      - name: Stux.Group Status
        url: https://status.stux.group/
        description: Stux.Group's websites and services
      - name: Stux.Cloud Status
        url: https://status.stux.cloud/
        description: Stux.Cloud's websites and pages

incidents:
  labels: [status]
